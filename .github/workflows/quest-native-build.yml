name: quest-native-build

on:
  push:
    branches:
      - "quest/**"
  workflow_dispatch:

concurrency:
  group: quest-native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-quest-native:
    name: Build Quest native App Server
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
      CARGO_PROFILE_RELEASE_PANIC: "unwind"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set}"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/bin:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_home}" >> "${GITHUB_ENV}"

      - name: Build single-file Android ARM64 library
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_NDK_HOME:?ANDROID_NDK_HOME missing}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          export LIBLZMA_NO_PKG_CONFIG=1
          toolchain="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="${toolchain}/bin:${PATH}"

          eval "$(python3 scripts/fetch_rusty_v8_android.py | grep '^export ' | sed 's/^export //')"
          export RUSTY_V8_ARCHIVE RUSTY_V8_SRC_BINDING_PATH
          python3 scripts/check_v8_sandbox.py "${RUSTY_V8_ARCHIVE}"

          export CC_aarch64_linux_android="aarch64-linux-android29-clang"
          export CXX_aarch64_linux_android="aarch64-linux-android29-clang++"
          export AR_aarch64_linux_android="llvm-ar"
          export RANLIB_aarch64_linux_android="llvm-ranlib"
          export PKG_CONFIG_ALLOW_CROSS=1
          export OPENSSL_NO_PKG_CONFIG=1
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="aarch64-linux-android29-clang++"

          builtins="$(find "${toolchain}" -name 'libclang_rt.builtins-aarch64-android.a' -print -quit)"
          libcxx_static="$(find "${toolchain}" -name 'libc++_static.a' -print -quit)"
          libcxxabi_static="$(find "${toolchain}" -name 'libc++abi.a' -print -quit)"

          test -n "${builtins}" || { echo "compiler-rt builtins archive not found" >&2; exit 1; }
          test -n "${libcxx_static}" || { echo "libc++_static.a not found" >&2; exit 1; }

          rustflags="-Clink-arg=${libcxx_static} -Clink-arg=${builtins}"
          if [ -n "${libcxxabi_static}" ]; then
            rustflags="${rustflags} -Clink-arg=${libcxxabi_static}"
          fi
          rustflags="${rustflags} -Clink-arg=-Wl,-z,max-page-size=16384 -Clink-arg=-Wl,-z,common-page-size=16384"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="${rustflags}"

          cd codex-rs
          rustup run 1.95.0 cargo build             --target aarch64-linux-android             --release             -p codex-app-server-android

          output="target/aarch64-linux-android/release/libcodex_app_server.so"
          test -f "${output}"
          llvm-strip --strip-unneeded "${output}"

      - name: Verify ELF contract
        shell: bash
        run: |
          set -euo pipefail
          output="codex-rs/target/aarch64-linux-android/release/libcodex_app_server.so"
          file "${output}"
          llvm-readelf -h "${output}"
          llvm-readelf -d "${output}" | tee /tmp/codex-needed.txt

          for forbidden in libc++_shared.so libssl.so libcrypto.so; do
            if grep -q "${forbidden}" /tmp/codex-needed.txt; then
              echo "libcodex_app_server.so has unexpected runtime dependency: ${forbidden}" >&2
              exit 1
            fi
          done

          for symbol in             codex_app_server_start             codex_app_server_stop             codex_app_server_is_running             codex_app_server_last_error             codex_app_server_version; do
            llvm-nm -D --defined-only "${output}" | grep -q " ${symbol}$" || {
              echo "missing exported symbol: ${symbol}" >&2
              exit 1
            }
          done

          sha256sum "${output}" | tee "${output}.sha256"
          ls -lh "${output}" "${output}.sha256"

      - name: Upload Quest library
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: quest-codex-app-server-arm64
          path: |
            codex-rs/target/aarch64-linux-android/release/libcodex_app_server.so
            codex-rs/target/aarch64-linux-android/release/libcodex_app_server.so.sha256
          if-no-files-found: error
